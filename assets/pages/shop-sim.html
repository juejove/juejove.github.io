    // ── SimulationView ────────────────────────────────────────────
    const SIM_SPEED = 1;
    const TICK_MS = Math.round(60000 / 720);

    const PARTY_TYPES = [
      { type: 'Single', emoji: '🧍' },
      { type: 'Couple', emoji: '👫' },
      { type: 'Family', emoji: '👨‍👩‍👧‍👦' },
      { type: 'Catchup', emoji: '👥' },
      { type: 'FineDining', emoji: '🥂' },
    ];
    const GROUP_AVG_SIZE = { Single: 1, Couple: 2, Family: 4, Catchup: 4, FineDining: 10 };

    const SEAT_ACCEPTS = {
      single: ['Single'],
      table4: ['Single', 'Couple', 'Family', 'Catchup'],
      sofa: ['Couple', 'Family', 'Catchup'],
      round: ['Family', 'Catchup', 'FineDining'],
      vip: ['Family', 'Catchup', 'FineDining'],
    };

    const DINE_TIME = (food) => {
      const base = food.preparing <= 3 ? 15 : food.preparing <= 6 ? 20 : food.preparing <= 10 ? 30 : 45;
      return base + Math.floor(Math.random() * 15);
    };

    function SimulationView({ shopConfig, currentStreet, time, onBack, money, setMoney, energy, setEnergy, loan, setLoan, setMyShops, onSleep }) {
      const { site, selectedFood, franchise, seatSummary, cells, hiredStaff } = shopConfig;
      const baseIsDineIn = selectedFood.dineIn;
      const isDineIn = baseIsDineIn || Math.random() < 0.25;
      const [unitPrice, setUnitPrice] = useState(() => {
        const basePrice = selectedFood.materialCost / (1 - selectedFood.grossMargin);
        return Math.round(basePrice);
      });
      const [priceSliderValue, setPriceSliderValue] = useState(50);
      const currentGrossMargin = (unitPrice - selectedFood.materialCost) / unitPrice;
      const priceCoefficient = 1 - (currentGrossMargin - selectedFood.grossMargin) * 2;

      const buildTables = () => {
        const tables = [];
        if (!seatSummary) return tables;
        Object.entries(seatSummary).forEach(([zone, v]) => {
          for (let i = 0; i < v.tables; i++) {
            tables.push({
              id: `${zone}_${i}`, zone, label: `${ZONE_INFO[zone].label}${i + 1}`,
              capacity: ZONE_INFO[zone].seats, state: 'empty', party: null, timer: 0
            });
          }
        });
        return tables;
      };

      const [tables, setTables] = useState(buildTables);
      const [queue, setQueue] = useState([]);
      const [simMin, setSimMin] = useState(600);
      const [running, setRunning] = useState(false);
      const [isOpen, setIsOpen] = useState(false);
      const [log, setLog] = useState([]);
      const [revenue, setRevenue] = useState(0);
      const [served, setServed] = useState(0);
      const [leftWithout, setLeftWithout] = useState(0);
      const [dayEnded, setDayEnded] = useState(false);
      const [daySummary, setDaySummary] = useState(null);
      const [isResting, setIsResting] = useState(false);
      const servedRef = React.useRef(0);

      // CHANGE 1: Only show assignment modal if no assignment has been set yet (first time)
      // Assignment is stored outside so it persists between view switches
      const [staffState, setStaffState] = useState(() => {
        const boss = {
          name: '老板(我)', salary: 0, cook: 10, service: 10, market: 10, age: 0,
          traits: '', topAttr: '💼综合', stamina: 80, satisfaction: 10, isBoss: true
        };
        return [boss, ...(hiredStaff || []).map(s => ({ ...s }))];
      });
      const [raiseModal, setRaiseModal] = useState(null);

      // CHANGE 1: showAssignModal only on first open (when assignment is null)
      const [assignment, setAssignment] = useState(shopConfig.savedAssignment || null);
      const [showAssignModal, setShowAssignModal] = useState(!shopConfig.savedAssignment);

      const franchiseBoost = franchise ? (1 + franchise.boost) : 1;
      const openDays = Number.isFinite(shopConfig.openDays) ? shopConfig.openDays : 0;
      const openingBonus = openDays >= 30 ? 1 : Math.max(1, 1.8 - (openDays * (0.8 / 30)));

      const dayOfWeek = time.getDay();
      const streetWeekdayFactor = currentStreet ? (currentStreet.weekdayFactor?.[dayOfWeek] || 1) : 1;
      const currentRenoCoeff = shopConfig.renoCoeff || 1;
      const bizBoost = { reputation: 1, renovation: currentRenoCoeff };
      const forecastedCustomers = currentStreet
        ? forecastCustomers(site, selectedFood, currentStreet, bizBoost, time) * streetWeekdayFactor * franchiseBoost * openingBonus : 50;
      const dailyCustomers = Math.max(1, forecastedCustomers);
      const peakArrivalRate = dailyCustomers / 720;

      const computeGroupWeights = () => {
        if (!currentStreet) return { Single: 1, Couple: 0.5, Family: 0.25, Catchup: 0.25, FineDining: 0.1 };
        const d = currentStreet.demand, a = selectedFood.Attraction;
        const raw = {}; let sumP = 0;
        ['Single', 'Couple', 'Family', 'Catchup', 'FineDining'].forEach(t => {
          const pf = (d[t] || 0) * (a[t] || 0); raw[t] = pf; sumP += pf;
        });
        const w = {};
        ['Single', 'Couple', 'Family', 'Catchup', 'FineDining'].forEach(t => {
          w[t] = sumP > 0 ? (raw[t] / sumP) / GROUP_AVG_SIZE[t] : 0;
        });
        return w;
      };
      const groupWeights = computeGroupWeights();

      const simRef = React.useRef({
        tables: buildTables(),
        queue: [],
        simMin: 600,
        revenue: 0,
        served: 0,
        leftWithout: 0,
        dayEnded: false,
        log: [],
      });

      const flushDisplay = () => {
        const s = simRef.current;
        setTables([...s.tables.map(t => ({ ...t }))]);
        setQueue([...s.queue]);
        setSimMin(s.simMin);
        setRevenue(s.revenue);
        setServed(s.served);
        setLeftWithout(s.leftWithout);
        setLog([...s.log]);
        servedRef.current = s.served;
      };

      const timeStr = (m) => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
      const addLog = (msg) => {
        simRef.current.log = [{ msg }, ...simRef.current.log].slice(0, 60);
      };

      const spawnParty = () => {
        const keys = ['Single', 'Couple', 'Family', 'Catchup', 'FineDining'];
        const wts = keys.map(k => groupWeights[k] || 0);
        const total = wts.reduce((a, b) => a + b, 0);
        let r = Math.random() * total, chosenType = 'Single';
        for (let i = 0; i < keys.length; i++) { r -= wts[i]; if (r <= 0) { chosenType = keys[i]; break; } }
        const pt = PARTY_TYPES.find(p => p.type === chosenType) || PARTY_TYPES[0];
        let size;
        if (chosenType === 'Single') size = 1;
        else if (chosenType === 'Couple') size = 2;
        else if (chosenType === 'Family') size = 2 + Math.floor(Math.random() * 5);
        else if (chosenType === 'Catchup') size = 2 + Math.floor(Math.random() * 5);
        else if (chosenType === 'FineDining') size = 5 + Math.floor(Math.random() * 11);
        else size = 1;
        return { id: Date.now() + Math.random(), type: chosenType, size, emoji: pt.emoji, arrivedAt: simRef.current.simMin, waitedMin: 0 };
      };

      const tickSim = React.useCallback(() => {
        const s = simRef.current;
        if (s.dayEnded) return;
        s.simMin += SIM_SPEED;

        // Day end at 22:00
        if (s.simMin >= 22 * 60) {
          s.simMin = 22 * 60;
          s.dayEnded = true;
          setDayEnded(true);
          const dailyRent = Math.round(site.rent / 30);
          const totalMonthly = (hiredStaff || []).reduce((a, h) => a + h.salary, 0);
          const staffSalaryDaily = Math.round(totalMonthly / 30);
          const loanDeduction = loan ? loan.dailyPayment : 0;

          const utilityDaily = Math.round(site.area / 2 + s.revenue * 0.015);
          // CHANGE 3: Boss energy cost = revenue / 200, only if open
          const bossEnergyDrain = isOpen ? Math.round(s.revenue / 200) : 0;
          setDaySummary({ dailyRent, staffSalaryDaily, loanDeduction, utilityDaily, bossEnergyDrain });
          const dailyDecay = Math.pow(0.96, 1 / 30);
          if (setMyShops) setMyShops(shops => shops.map(sh =>
            sh === shopConfig ? { ...sh, renoCoeff: Math.max(0.1, (sh.renoCoeff || 1) * dailyDecay) } : sh
          ));
          setStaffState(prev => {
            const perStaff = Math.ceil(s.served / Math.max(1, prev.filter(x => !x.isBoss).length));
            return prev.map(staff => {
              if (staff.isBoss) return staff;
              let sat = staff.satisfaction;
              if (perStaff > staff.stamina) sat = Math.max(0, sat - 1);
              return { ...staff, satisfaction: sat };
            });
          });
          if (loan && loan.daysLeft > 0 && setMoney) {
            setMoney(m => m - loan.dailyPayment);
            if (setLoan) setLoan(prev => prev ? { ...prev, daysLeft: prev.daysLeft - 1 } : null);
          }
          setRunning(false);
          flushDisplay();
          return;
        }

        if (isOpen) {
          const nm = s.simMin;
          const isOpenTime = nm >= 10 * 60 && nm < 21 * 60;

          const _getPrepTime = () => {
            const kNames = assignment ? assignment.kitchen : [];
            const kStaff = staffState.filter(s => kNames.includes(s.name));
            const avgCook = kStaff.length > 0 ? kStaff.reduce((acc, p) => acc + (p.cook || 5), 0) / kStaff.length : 5;
            const cookMult = 1.3 - (avgCook - 1) * 0.06;
            const lowSatP = kStaff.some(p => p.satisfaction < 3) ? 1.3 : 1.0;
            const kCells = cells ? cells.flat().filter(c => c === 'kitchen').length : selectedFood.kitchenAreaPP;
            const chefCount = Math.max(1, Math.floor(kCells / selectedFood.kitchenAreaPP));
            const areaRatio = kCells / (selectedFood.kitchenAreaPP * chefCount);
            const base = areaRatio >= 1 ? selectedFood.preparing : Math.round(selectedFood.preparing / areaRatio);
            return Math.max(1, Math.round(base * cookMult * lowSatP));
          };
          const _getCheckoutTime = () => {
            const fNames = assignment ? assignment.front : [];
            const fStaff = staffState.filter(s => fNames.includes(s.name));
            return fStaff.some(p => p.satisfaction < 3) ? 4 : 2;
          };

          if (isOpenTime) {
            const hf = nm / 60;
            const peakMult = (hf >= 11 && hf < 13) || (hf >= 17 && hf < 20) ? 2 : 0.6;
            if (Math.random() < peakArrivalRate * peakMult * SIM_SPEED) {
              const party = spawnParty();
              if (!isDineIn) {
                const spend = party.size * selectedFood.materialCost / (1 - selectedFood.grossMargin) * openingBonus;
                s.revenue += spend;
                s.served += party.size;
                addLog(`${timeStr(nm)} ${party.emoji} ${party.type}×${party.size} 外卖 (开业加成 ${openingBonus.toFixed(2)}x)`);
              } else {
                s.queue = [...s.queue, party];
              }
            }
          }

          if (isDineIn) {
            s.queue = s.queue.map(p => ({ ...p, waitedMin: p.waitedMin + SIM_SPEED }));
            const imp = s.queue.filter(p => p.waitedMin > 20);
            imp.forEach(p => addLog(`${timeStr(nm)} ${p.emoji} 等太久离开`));
            s.leftWithout += imp.length;
            s.queue = s.queue.filter(p => p.waitedMin <= 20);

            s.queue = s.queue.filter(party => {
              const compat = s.tables.filter(t =>
                t.state === 'empty' &&
                SEAT_ACCEPTS[t.zone]?.includes(party.type) &&
                t.capacity >= party.size
              );
              if (compat.length === 0) return true;
              compat.sort((a, b) => a.capacity - b.capacity);
              const table = compat[0];
              table.state = 'ordering';
              table.party = { ...party };
              table.timer = 3;
              addLog(`${timeStr(nm)} ${party.emoji} ${party.type}×${party.size} 入座 ${table.label}`);
              return false;
            });

            s.tables.forEach(t => {
              if (t.state === 'empty') return;
              if (t.timer > 0) { t.timer -= SIM_SPEED; if (t.timer > 0) return; }
              switch (t.state) {
                case 'ordering':
                  t.state = 'waiting';
                  t.timer = Math.max(1, _getPrepTime());
                  addLog(`${timeStr(nm)} 🍳 ${t.label} 出餐 ~${t.timer}分钟`);
                  break;
                case 'waiting':
                  t.state = 'eating';
                  t.timer = Math.max(1, DINE_TIME(selectedFood));
                  addLog(`${timeStr(nm)} 🍽️ ${t.label} 用餐 ~${t.timer}分钟`);
                  break;
                case 'eating':
                  t.state = 'checkout';
                  t.timer = Math.max(1, _getCheckoutTime());
                  break;
                case 'checkout': {
                  if (!t.party) { t.state = 'cleaning'; t.timer = 1; break; }
                  const partySize = t.party.size || 1;
                  const spend = partySize * selectedFood.materialCost / (1 - selectedFood.grossMargin) * openingBonus;
                  s.revenue += spend;
                  s.served += partySize;
                  addLog(`${timeStr(nm)} 💰 ${t.label} ¥${Math.round(spend)} (${partySize}人) (开业加成 ${openingBonus.toFixed(2)}x)`);
                  t.state = 'cleaning'; t.party = null; t.timer = 1;
                  break;
                }
                case 'cleaning': {
                  t.state = 'empty'; t.party = null; t.timer = 0;
                  addLog(`${timeStr(nm)} 🧹 ${t.label} 清理完成`);
                  break;
                }
              }
            }
            );
          }
        }

        flushDisplay();
      }, [running, assignment, isDineIn, peakArrivalRate, staffState, loan, cells, isOpen]);

      const resetSim = () => {
        const freshTables = buildTables();
        simRef.current = { tables: freshTables, queue: [], simMin: 600, revenue: 0, served: 0, leftWithout: 0, dayEnded: false, log: [] };
        setTables(freshTables.map(t => ({ ...t })));
        setQueue([]); setSimMin(600); setLog([]);
        setRevenue(0); setServed(0); setLeftWithout(0); setRunning(false);
        setIsOpen(false); setDayEnded(false); setDaySummary(null); servedRef.current = 0;
        // CHANGE 2: Don't show assign modal on reset if assignment already exists
        // Just keep existing assignment
      };

      useEffect(() => {
        if (!running || !assignment) return;
        const interval = setInterval(tickSim, TICK_MS);
        return () => clearInterval(interval);
      }, [running, assignment, tickSim]);

      const stateColor = { empty: '#f5f5f5', ordering: '#fff9c4', waiting: '#ffccbc', eating: '#c8e6c9', checkout: '#e1bee7' };
      const stateLabel = { empty: '空', ordering: '点单', waiting: '等餐', eating: '用餐', checkout: '结账' };

      const resignedStaff = staffState.filter(s => !s.isBoss && s.satisfaction <= 0);

      // CHANGE 2: Handler for sleep button at day end
      const handleSleepAfterDay = () => {
        if (daySummary) {
          // Deduct utility from money
          setMoney(m => m - daySummary.utilityDaily);
          // CHANGE 3: Boss energy cost = revenue / 200, only if open
          if (isOpen) setEnergy(e => Math.max(0, e - daySummary.bossEnergyDrain));
        }
        // Always deduct daily living expense and restore energy
        setMoney(m => m - DAILY_EXPENSE);
        if (setEnergy) setEnergy(e => Math.min(INITIAL_ENERGY, e + ENERGY_RESTORED));

        // Opening bonus decays as shop ages. increment openDays each day
        if (setMyShops) {
          setMyShops(shops => shops.map(sh => sh === shopConfig ? { ...sh, openDays: openDays + 1 } : sh));
        }

        

        // Reset simulation for next day
        resetSim();
      };

      const handleRestDay = () => {
        if (daySummary) {
          // Deduct utility from money
          setMoney(m => m - daySummary.utilityDaily);
          // CHANGE 3: Deduct boss energy (revenue/200)
          if (setEnergy) setEnergy(e => Math.max(0, e - daySummary.bossEnergyDrain));
        }
        // No daily living expense or energy restore for rest day

        // Employee satisfaction recovery: 20% chance +1
        setStaffState(prev => prev.map(staff => {
          if (staff.isBoss) return staff;
          const recover = Math.random() < 0.2;
          return recover ? { ...staff, satisfaction: Math.min(10, staff.satisfaction + 1) } : staff;
        }));

        // Opening bonus decays as shop ages. increment openDays each day
        if (setMyShops) {
          setMyShops(shops => shops.map(sh => sh === shopConfig ? { ...sh, openDays: openDays + 1 } : sh));
        }

        // Reset simulation and mark as resting
        resetSim();
        setIsResting(true);
      };

      return (
        <>
          {/* CHANGE 1: Assignment modal only shows when showAssignModal is true (first open) */ }
          {
            showAssignModal && (
              <StaffAssignModal
            allStaff={staffState.filter(s => s.satisfaction > 0 || s.isBoss)}
            initialAssignment={assignment}
            selectedFood={selectedFood}
            onConfirm={a => {
              setAssignment(a);
              setShowAssignModal(false);
              // Save assignment to shopConfig so it persists
              if (setMyShops) setMyShops(shops => shops.map(sh => sh === shopConfig ? { ...sh, savedAssignment: a } : sh));
            }}
            onCancel={() => setShowAssignModal(false)}
          />
        )
      }

      {
        raiseModal && (
          <div className="modal-bg">
            <div className="modal" style={{ maxWidth: 380 }}>
              <div className="modal-title">💬 {raiseModal.name} 要求涨薪</div>
              <p style={{ fontSize: 12, color: '#666', marginBottom: 12 }}>
                当前满意度 {raiseModal.satisfaction}/10，耐力 {raiseModal.stamina}。涨薪须5%倍数，每5%满意度+2，耐力+10%。
              </p>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginBottom: 12 }}>
                {[5, 10, 15, 20].map(pct => {
                  const newSal = Math.round(raiseModal.salary * (1 + pct / 100));
                  const rounds = pct / 5;
                  return (
                    <button key={pct} className="btn" style={{ textAlign: 'left', fontSize: 12 }}
                      onClick={() => {
                        setStaffState(prev => prev.map(s => s.name === raiseModal.name
                          ? { ...s, salary: newSal, satisfaction: Math.min(10, s.satisfaction + rounds * 2), stamina: Math.round(s.stamina * Math.pow(1.1, rounds)) } : s));
                        setRaiseModal(null);
                      }}>
                      涨薪{pct}% → ¥{newSal.toLocaleString()}/月，满意度+{rounds * 2}，耐力+{pct}%
                    </button>
                  );
                })}
                <button className="btn" style={{ fontSize: 12, color: '#c0392b' }}
                  onClick={() => {
                    setStaffState(prev => prev.map(s => s.name === raiseModal.name ? { ...s, satisfaction: Math.max(0, s.satisfaction - 1) } : s));
                    setRaiseModal(null);
                  }}>忽略（满意度继续下降）</button>
              </div>
            </div>
          </div>
        )
      }

      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
        <div style={{ fontSize: 15, fontWeight: 600 }}>
          🍽️ 营业模拟 — {site.name}
          {franchise && <span style={{ color: '#2d7a1f', fontSize: 12, marginLeft: 8 }}>🏷️ {franchise.name} +{Math.round(franchise.boost * 100)}%</span>}
        </div>
        <div style={{ fontSize: 12, color: '#555', marginTop: 4 }}>
          开业加成：{openingBonus.toFixed(2)}x（第 {openDays + 1} 天，30天递减到1.00）
        </div>
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
          <button className="btn" onClick={() => setShowAssignModal(true)}>👥 调整分工</button>
          <button className="btn" onClick={resetSim}>↺ 重置</button>
          {/* Day-end: only show sleep button */}
          {dayEnded && (
            <button className="btn primary" style={{ background: '#5c6bc0' }} onClick={handleSleepAfterDay}>
              🛏️ 睡觉（-¥{DAILY_EXPENSE}生活费，+{ENERGY_RESTORED}精力，开始新的一天）
            </button>
          )}
          {/* After sleep: show open/rest options */}
          {!dayEnded && !isResting && (
            <>
              {!isOpen ? (
                <>
                  <button className="btn primary" onClick={() => setIsOpen(true)} disabled={!assignment}>
                    🏪 开门营业
                  </button>
                  <button className="btn" onClick={handleRestDay}>

                  </button>

                <button className="btn primary" onClick={() => setRunning(r => !r)} disabled={!assignment}>

          )}
          {/* During rest: show street button */}
          {isResting && (
            <button className="btn" onClick={() => { setRunning(false); setIsResting(false); onBack(); }}>← 离开，去逛街</button>

        </div>
      </div>

      {
        resignedStaff.length > 0 && (
          <div style={{ background: '#ffeaea', border: '1.5px solid #f44336', borderRadius: 8, padding: '10px 14px', marginBottom: 10, fontSize: 12, color: '#c0392b' }}>
            ⚠️ {resignedStaff.map(s => s.name).join('、')} 满意度归零，已辞职！
          </div>
        )
      }

      {
        assignment && (
          <div style={{ background: '#f0f7ff', border: '1px solid #90caf9', borderRadius: 6, padding: '6px 12px', marginBottom: 8, fontSize: 11, display: 'flex', gap: 16, flexWrap: 'wrap' }}>
            <span>🍳 后厨: {assignment.kitchen.join('、') || '无'}</span>
            <span>😊 前厅: {assignment.front.join('、') || '无'}</span>
            <span>📣 营销: {assignment.market.join('、') || '无'}</span>
          </div>
        )
      }

      {/* Pricing UI */ }
      <div>
        <div style={{ background: '#f9f9f9', border: '1px solid #ddd', borderRadius: 6, padding: '8px 12px', marginBottom: 8 }}>
          <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 6 }}>💰 定价策略</div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
            <input type="range" min={Math.ceil(selectedFood.materialCost)} max={Math.ceil(selectedFood.materialCost * 3)} step={1}
              value={unitPrice} onChange={e => { setUnitPrice(parseInt(e.target.value)); setPriceSliderValue(((parseInt(e.target.value) - selectedFood.materialCost) / (selectedFood.materialCost * 2)) * 100); }}
              style={{ flex: 1, minWidth: 150 }} />
            <span style={{ fontWeight: 700, color: '#c0392b', minWidth: 60 }}>¥{unitPrice}</span>
          </div>
          <div style={{ marginTop: 6, display: 'flex', justifyContent: 'space-between', fontSize: 11 }}>
            <span>成本：¥{selectedFood.materialCost}</span>
            <span>毛利率：{Math.round(currentGrossMargin * 100)}%</span>
            <span>系数：{priceCoefficient.toFixed(2)}x</span>
          </div>
        </div>


        <div style={{ display: 'flex', gap: 8, marginBottom: 10, flexWrap: 'wrap' }}>
          {[
            { label: '时间', value: timeStr(simMin) },
            { label: '今日营业额', value: `¥${Math.round(revenue).toLocaleString()}` },
            { label: '已服务人数', value: served + '人' },
            { label: '流失客(组)', value: leftWithout },
            { label: '等位', value: queue.length + '组' },
            { label: '装修系数', value: `${((shopConfig.renoCoeff || 1) * 100).toFixed(1)}%` },
          ].map(({ label, value }) => (
            <div key={label} className="hud-card" style={{ minWidth: 70 }}>
              <div className="hud-label">{label}</div>
              <div className="hud-value" style={{ fontSize: 13 }}>{value}</div>
            </div>
          ))}
        </div>

        {/* CHANGE 2 & 3: Day-end summary with sleep button and boss energy drain + utility shown as result only */}
        {dayEnded && daySummary && (
          <div style={{ background: '#fff9e6', border: '1.5px solid #ffc107', borderRadius: 8, padding: '12px 16px', marginBottom: 12 }}>
            <div style={{ fontWeight: 700, fontSize: 13, marginBottom: 8 }}>📋 今日营业总结</div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '4px 20px', fontSize: 12, marginBottom: 10 }}>
              <span>营业额</span><span style={{ fontWeight: 600, color: '#2d7a1f' }}>¥{Math.round(revenue).toLocaleString()}</span>
              <span>食材成本(估)</span><span style={{ color: '#c0392b' }}>−¥{Math.round(revenue * (1 - selectedFood.grossMargin)).toLocaleString()}</span>
              <span>今日租金(月租÷30)</span><span style={{ color: '#c0392b' }}>−¥{daySummary.dailyRent.toLocaleString()}</span>
              <span>今日工资(÷30)</span><span style={{ color: '#c0392b' }}>−¥{daySummary.staffSalaryDaily.toLocaleString()}</span>
              {/* CHANGE 3: Utility shown as single result, no formula */}
              <span>水电费</span><span style={{ color: '#c0392b' }}>−¥{daySummary.utilityDaily.toLocaleString()}</span>
              {daySummary.loanDeduction > 0 && <><span>贷款日还款</span><span style={{ color: '#c0392b' }}>−¥{Math.round(daySummary.loanDeduction).toLocaleString()}</span></>}
              <span style={{ fontWeight: 700, borderTop: '1px solid #eee', paddingTop: 4 }}>毛利润(估)</span>
              <span style={{
                fontWeight: 700, borderTop: '1px solid #eee', paddingTop: 4,
                color: (revenue * selectedFood.grossMargin - daySummary.dailyRent - daySummary.staffSalaryDaily - daySummary.utilityDaily - (daySummary.loanDeduction || 0)) >= 0 ? '#2d7a1f' : '#c0392b'
              }}>
                ¥{Math.round(revenue * selectedFood.grossMargin - daySummary.dailyRent - daySummary.staffSalaryDaily - daySummary.utilityDaily - (daySummary.loanDeduction || 0)).toLocaleString()}
              </span>
            </div>

            {/* CHANGE 3: Boss energy cost display */}
            <div style={{ background: '#f0f4ff', border: '1px solid #c5cae9', borderRadius: 6, padding: '8px 10px', marginBottom: 10, fontSize: 12 }}>
              <span style={{ fontWeight: 600 }}>👑 老板今日体力消耗：</span>
              <span style={{ color: '#c0392b', fontWeight: 600 }}> -{daySummary.bossEnergyDrain} 精力</span>
              <span style={{ color: '#888', marginLeft: 6, fontSize: 11 }}>(在店工作日结算)</span>
            </div>

            {staffState.filter(s => !s.isBoss).length > 0 && (
              <div style={{ borderTop: '1px solid #ffe082', paddingTop: 8 }}>
                <div style={{ fontWeight: 600, fontSize: 12, marginBottom: 6 }}>👥 员工状态</div>
                {staffState.filter(s => !s.isBoss).map((s, i) => {
                  const satColor = s.satisfaction >= 7 ? '#2d7a1f' : s.satisfaction >= 5 ? '#a06000' : '#c0392b';
                  return (
                    <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 4, fontSize: 11, flexWrap: 'wrap' }}>
                      <span style={{ fontWeight: 600 }}>{s.name}</span>
                      <span style={{ color: '#888' }}>耐力{s.stamina}</span>
                      <span style={{ color: satColor, fontWeight: 600 }}>满意度{s.satisfaction}/10</span>
                      {s.satisfaction <= 0 && <span style={{ color: '#c0392b', fontWeight: 700 }}>🚪已辞职</span>}
                      {s.satisfaction > 0 && s.satisfaction < 3 && <span style={{ color: '#c0392b' }}>⚠️出餐/结账变慢</span>}
                      {s.satisfaction >= 3 && s.satisfaction < 5 && (
                        <button style={{ fontSize: 10, padding: '2px 8px', background: '#fff3cd', border: '1px solid #ffc107', borderRadius: 4, cursor: 'pointer' }}
                          onClick={() => setRaiseModal(s)}>
                          😤涨薪
                        </button>
                      )}
                    </div>
                  );
                })}
              </div>
            )}

            {/* CHANGE 2: Sleep button at the bottom of summary */}
            <div style={{ marginTop: 12, borderTop: '1px solid #ffe082', paddingTop: 10 }}>
              <button className="btn primary" style={{ width: '100%', background: '#5c6bc0', fontSize: 13, padding: '10px' }}
                onClick={handleSleepAfterDay}>
                🛏️ 睡觉，开始新的一天（-¥{DAILY_EXPENSE}生活费，+{ENERGY_RESTORED}精力）
              </button>
              <div style={{ fontSize: 10, color: '#888', marginTop: 4, textAlign: 'center' }}>明天可以选择开门营业或歇业休息</div>
            </div>
          </div>
        )}

        <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap' }}>
          <div style={{ flex: 1, minWidth: 260 }}>
            <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 6 }}>桌位状态  {!isDineIn ? ' - 外卖/打包店，客人不就坐' : ''}</div>
           
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
              {tables.map(t => (
                <div key={t.id} style={{ width: 88, padding: '6px 8px', borderRadius: 6, fontSize: 11, background: stateColor[t.state] || '#f5f5f5', border: `1.5px solid ${t.state === 'empty' ? '#ddd' : '#aaa'}` }}>
                  <div style={{ fontWeight: 600 }}>{t.label}</div>
                  <div style={{ color: '#666' }}>{stateLabel[t.state]}</div>
                  {t.party && <div>{t.party.emoji}×{t.party.size}</div>}
                  {t.timer > 0 && <div style={{ color: '#888' }}>~{t.timer}分</div>}
                </div>
              ))}
              {tables.length === 0 && <div style={{ fontSize: 11, color: '#888' }}>暂无座位，请先布局</div>}
            </div>
            {queue.length > 0 && (
              <div style={{ marginTop: 8 }}>
                <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 4 }}>等位区 ({queue.length}组)</div>
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: 4 }}>
                  {queue.map(p => (
                    <div key={p.id} style={{ padding: '2px 7px', background: '#fff3cd', borderRadius: 12, fontSize: 11, border: '1px solid #ffc107' }}>
                      {p.emoji}×{p.size} {p.waitedMin}分
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
          <div style={{ width: 230, flexShrink: 0 }}>
            <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 6 }}>事件日志</div>
            <div style={{ height: 280, overflowY: 'auto', background: '#fafafa', borderRadius: 6, padding: '6px 8px', border: '1px solid #eee' }}>
              {log.length === 0 && <div style={{ fontSize: 11, color: '#aaa' }}>点击开始营业...</div>}
              {log.map((l, i) => (
                <div key={i} style={{ fontSize: 11, padding: '2px 0', borderBottom: '0.5px solid #f0f0f0', color: i === 0 ? '#111' : '#666' }}>{l.msg}</div>
              ))}
            </div>
          </div>
        </div>
      </div>
        </>
      );
    }


    // ============================================================
    // SECTION 8: MAIN APP
    // ============================================================

    function App() {

      const [money, setMoney] = useState(INITIAL_MONEY);
      const [energy, setEnergy] = useState(INITIAL_ENERGY);
      const [time, setTime] = useState(new Date(START_DATE));
      const [mode, setMode] = useState('player');
      const [streetData, setStreetData] = useState(null);
      const [currentStreet, setCurrentStreet] = useState(null);
      const [takenSites, setTakenSites] = useState([]);
      const [playerValue, setPlayerValue] = useState(INITIAL_PLAYER_VALUES);

      const [selectedSite, setSelectedSite] = useState(null);
      const [showForecast, setShowForecast] = useState(null);
      const [callResultRevealed, setCallResultRevealed] = useState(false);
      const [toast, setToast] = useState('');
      const [spiInfo, setSpiInfo] = useState(null);
      const [spiMode, setSpiMode] = useState(null);
      const [siteSpyInfo, setSiteSpyInfo] = useState({});
      const [takenBySomeone, setTakenBySomeone] = useState(new Set());

      const [foodSelectModal, setFoodSelectModal] = useState(null);
      const [franchiseModal, setFranchiseModal] = useState(null);
      const [recruitModal, setRecruitModal] = useState(null);
      const [myShops, setMyShops] = useState([]);
      const [learnedFoodTech, setLearnedFoodTech] = useState([]);

      const [loan, setLoan] = useState(null);
      const [loanModal, setLoanModal] = useState(false);

      const [mainView, setMainView] = useState('street');
      const [activeShopConfig, setActiveShopConfig] = useState(null);
      const [pendingFloorplan, setPendingFloorplan] = useState(null);

      const biz = { reputation: 1, renovation: 1 };

      const containerRef = useRef(null);
      const [containerW, setContainerW] = useState(() => window.innerWidth - 48);

      React.useLayoutEffect(() => {
        if (containerRef.current) {
          setContainerW(containerRef.current.offsetWidth);
        }
        const onResize = () => {
          if (containerRef.current) setContainerW(containerRef.current.offsetWidth);
        };
        window.addEventListener('resize', onResize);
        return () => window.removeEventListener('resize', onResize);
      }, []);

      const totalFrontageA = streetData
        ? streetData.streetA.reduce((s, x) => s + x.frontage, 0)
        : 1;
      const scale = Math.max(1, (containerW - 4) / totalFrontageA);

      const depthPx = streetData
        ? Math.max(60, Math.min(120, streetData.depth * scale * 0.55))
        : 80;

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(''), 2800);
      };

      const handleSleepHunting = () => {
        setMoney(m => m - DAILY_EXPENSE);
        setEnergy(e => Math.min(INITIAL_ENERGY, e + ENERGY_RESTORED));
        setTime(t => { const d = new Date(t); d.setDate(d.getDate() + 1); return d; });
        setTakenSites([]);
        const st = pick(STREET_LIBRARY);
        const data = generateStreet(st, biz, time);
        setStreetData(data);
        setCurrentStreet(st);
        setSelectedSite(null);
        setShowForecast(null);
        if (streetData) {
          const allSites = [...(streetData.streetA || []), ...(streetData.streetB || [])];
          checkSitesRentedBySomeone(allSites);
        }
      };

      const ensureMoney = (requiredAmount) => {
        if (money >= requiredAmount) return true;
        if (!loan) {
          setLoanModal(true);
          showToast('资金不足，已为您打开贷款窗口');
        } else {
          showToast('资金不足，当前已有贷款仍不足以完成操作');
        }
        return false;
      };

      const checkSitesRentedBySomeone = (sitesArray) => {
        if (!sitesArray || sitesArray.length === 0) return;

        setTakenBySomeone(prev => {
          const updated = new Set(prev);
          sitesArray.forEach(site => {
            const siteKey = `${site.name}||${site.type}`;
            if ((site.forlease || site.forsale) && !updated.has(siteKey)) {
              const chance = 0.02 + Math.random() * 0.04;
              if (Math.random() < chance) {
                updated.add(siteKey);
                showToast(`⚠️ ${site.name} 已被他人租走`);
              }
            }
          });
          return updated;
        });
      };

      const isSiteTakenBySomeone = (site) => {
        if (!site) return false;
        const siteKey = `${site.name}||${site.type}`;
        return takenBySomeone.has(siteKey);
      };

      const doRegenerate = useCallback((free = false) => {
        if (!free && !ensureMoney(DAILY_EXPENSE)) return;
        const cost = free ? 0 : DAILY_EXPENSE;
        if (!free) setMoney(m => m - cost);
        setTime(t => { const d = new Date(t); d.setDate(d.getDate() + 1); return d; });
        setTakenSites([]);
        const st = pick(STREET_LIBRARY);
        const data = generateStreet(st, biz, time);
        setStreetData(data);
        setCurrentStreet(st);
        setSelectedSite(null);
        setShowForecast(null);
      }, [money, time]);

      useEffect(() => { doRegenerate(true, true); }, []);

      const handleSiteClick = (site) => {
        if (spiMode === 'snoop') {
          handleSnoopSite(site);
          return;
        }
        if (spiMode === 'count') {
          handleCountingSite(site);
          return;
        }
        setSelectedSite(site);
        setCallResultRevealed(false);
      };

      const handleTake = (site, type) => {
        const cost = type === 'lease'
          ? (site.rent + site.bond)
          : (site.salePrice + site.rent + site.bond);
        if (money < cost) {
          ensureMoney(cost);
          return;
        }
        setMoney(m => m - cost);
        setTakenSites(ts => [...ts, site]);
        setSelectedSite(null);
        showToast(`成功签约！支付 ¥${cost.toLocaleString()}`);
        setFoodSelectModal({ site, type });
      };

      const handleCallResult = (rev) => {
        setMoney(m => m - 199);
        setCallResultRevealed(true);
      };

      const handleConvertRetail = (site) => {
        if (!site.retail || site.convertedToFood) {
          showToast('该店铺无法改造');
          return;
        }

        const suitableFood = FOOD_LIBRARY.filter(f => site.area >= (f.minArea || 0));
        const selectedFood = suitableFood.length > 0 ? pick(suitableFood) : FOOD_LIBRARY[2];

        const newSmokeFree = Math.random() < 0.4;

        const convertedSite = {
          ...site,
          food: selectedFood,
          convertedToFood: true,
          smokeFree: newSmokeFree && !selectedFood.smoke,
          allowOutShop: site.allowOutShop,
          name: pick(SHOP_NAMES) + selectedFood.name
        };

        if (currentStreet) {
          const forecastRev = forecastCustomers(convertedSite, selectedFood, currentStreet, { reputation: 1, renovation: 1 }, time)
            * (selectedFood.materialCost / (1 - selectedFood.grossMargin));

          if (convertedSite.forlease) {
            if (Math.random() < 0.4) {
              convertedSite.currentRevenue = 0;
            } else {
              convertedSite.currentRevenue = forecastRev * (0.2 + Math.random() * 0.4);
            }
          } else {
            convertedSite.currentRevenue = forecastRev;
          }
        }

        setTakenSites(ts => ts.map(s => s === site ? convertedSite : s));
        setSelectedSite(convertedSite);
        showToast(`✏️ 改造完成！现改为 ${selectedFood.name} 店${newSmokeFree ? ' (禁油烟)' : ''}`);
      };

      const getInfoProbabilities = (investigate) => {
        const clamped = Math.max(10, Math.min(40, investigate));
        const t = (clamped - 10) / 30;
        const lowChance = 60 - (40 * t);
        const mediumChance = 30 + (10 * t);
        const highChance = 10 + (30 * t);
        return { lowChance, mediumChance, highChance };
      };

      const selectInfoTier = (investigate) => {
        const { lowChance, mediumChance, highChance } = getInfoProbabilities(investigate);
        const roll = Math.random() * 100;

        if (roll < lowChance) {
          return { includeHigh: false, includeMedium: false, includeLow: true };
        } else if (roll < lowChance + mediumChance) {
          return { includeHigh: false, includeMedium: true, includeLow: false };
        } else {
          return { includeHigh: true, includeMedium: false, includeLow: false };
        }
      };

      const handleSnoop = () => {
        if (spiMode === 'snoop') {
          setSpiMode(null);
          return;
        }
        if (energy < ENERGY_COST.snoop) { showToast('精力不足'); return; }
        setSpiMode('snoop');
      };

      const handleSnoopSite = (site) => {
        if (energy < ENERGY_COST.snoop) { showToast('精力不足'); return; }

        setEnergy(e => e - ENERGY_COST.snoop);
        setSpiMode(null);

        const investigate = playerValue.investigate;
        const { includeHigh, includeMedium, includeLow } = selectInfoTier(investigate);

        const allHighMessages = [];
        const allMediumMessages = [];
        let allLowMessages = [];

        const isSourceSite = ['school', 'residential', '写字楼', '车站', '景点'].includes(site.type);

        if (isSourceSite) {
          const sourceCount = [...(streetData?.streetA || []), ...(streetData?.streetB || [])]
            .filter(s => ['school', 'residential', '写字楼', '车站', '景点'].includes(s.type)).length;
          const totalFlow = Math.round(streetData.street.typicalFlow * (sourceCount > 1 ? 1 + 0.2 * sourceCount : 1));
          const flowPerSource = Math.round(totalFlow / Math.max(sourceCount, 1));

          //allHighMessages.push(`📍 ${site.name} 日均人流约${flowPerSource.toLocaleString()}人`);

          const weekendFactorSum = currentStreet.weekdayFactor?.[5] || 1 + currentStreet.weekdayFactor?.[6] || 1;
          const weekendPercent = Math.round(weekendFactorSum / 7 * 100);

          if (site.type === 'school') {
            const studentCount = flowPerSource * 30 / 31;
            const teacherCount = Math.ceil(studentCount / 30);

            const schoolType = pick(['小学', '初中']);
            const classAmount = Math.floor(Math.random() * 7) + 3;
            const grades = schoolType === '小学' ? 6 : 3;
            const studentperClass = Math.ceil(studentCount / classAmount * grades);;
            allHighMessages.push(`🏫 该学校为${schoolType}`);
            allMediumMessages.push(`👨‍🎓 每个年级班级数: ${classAmount.toLocaleString()}班`);
            allMediumMessages.push(`👨‍🎓 每个年级大概人数: ${studentperClass.toLocaleString()}人`);
            allMediumMessages.push(`👨‍🏫 老师数: 约${teacherCount}人`);
            allMediumMessages.push(`🗓️ 周末人流量占比: ${weekendPercent}%`);
            allLowMessages = gossip_LIBRARY_source.school
          }
          else if (site.type === 'residential') {
            allLowMessages = gossip_LIBRARY_source.residential
            const occupancyRate = Math.random() * 0.7 + 0.3;
            const unitsPerBuilding = Math.ceil(Math.random() * 40 + 80);
            const buildingCount = Math.ceil(flowPerSource / (occupancyRate * unitsPerBuilding * 3));
            allMediumMessages.push(`🏢 楼栋数: ${buildingCount}栋`);
            allMediumMessages.push(`🚪 户数/栋: 约${unitsPerBuilding}户`);
            allMediumMessages.push(`👥 入住率: ${Math.round(occupancyRate * 100)}%`);
          }
          else if (site.type === '车站') {
            allMediumMessages.push(`🗓️ 周末人流量占比: ${weekendPercent}%`);
            allLowMessages = gossip_LIBRARY_source.station
          }
          else if (site.type === '景点') {
            const avgTicketPrice = Math.round((Math.random() * 80 + 20) / 10) * 10;
            allMediumMessages.push(`🎫 平均门票: ¥${avgTicketPrice}`);
            allMediumMessages.push(`🗓️ 周末人流量占比: ${weekendPercent}%`);
            allLowMessages = gossip_LIBRARY_source.tourism
          }
        } else if (site.food) {
          const clamped = Math.max(10, Math.min(40, investigate));
          const maxError = 0.3 * (40 - clamped) / 30;
          const errorAmount = maxError * (Math.random() - 0.5) * 2;
          const estimatedRev = Math.round(site.forecastRev * (1 + errorAmount));
          allHighMessages.push(`💰 预计日营业额: ¥${estimatedRev.toLocaleString()} (打听得到)`);

          const daily = site.forecastRev ? Math.round(site.forecastRev) : 0;
          const staffCount = Math.max(1, Math.ceil(daily / site.food.revPerStaff));
          const costPerCustomer = site.food.materialCost;
          const profitMargin = Math.round((1 - site.food.grossMargin) * 100);

          allMediumMessages.push(`👥 日均员工需求: ${staffCount}人`);
          allMediumMessages.push(`💵 每位客户消费: ¥${(costPerCustomer / (1 - site.food.grossMargin)).toFixed(1)}`);
          allMediumMessages.push(`📈 毛利率: ${profitMargin}%`);
          allMediumMessages.push(`${site.smokeFree ? '⛔ 禁油烟' : '🔥 可做油烟'}`);
          allMediumMessages.push(`${site.allowOutShop ? '✅ 允许外摆' : '❌ 不允许外摆'}`);

          const monthlyRev = daily * 30;
          const monthlyFood = Math.round(monthlyRev * (1 - site.food.grossMargin));
          const staffMonthly = Math.max(Math.ceil(daily / site.food.revPerStaff) * 4000, 4000);
          const profit = monthlyRev - site.rent - monthlyFood - staffMonthly - (1000 + monthlyRev * 0.015);
          allMediumMessages.push(`${profit > 0 ? '✅盈利' : '❌亏损'}`);

          if (daily < 20) {
            allMediumMessages.push(`⚠️  日均客流偏少: 仅${daily}人`);
          }

          const d = currentStreet.demand;
          const a = site.food.Attraction;
          const total = d.Single * a.Single + d.Couple * a.Couple + d.Family * a.Family + d.Catchup * a.Catchup + d.FineDining * a.FineDining;

          if (total > 0) {
            allLowMessages.push(`👤 客群: ${Math.round(d.Single * a.Single / total * 100)}%单身, ${Math.round(d.Couple * a.Couple / total * 100)}%情侣, ${Math.round(d.Family * a.Family / total * 100)}%家庭`);
          }
        } else {
          allHighMessages.push(`🏪 ${site.name} 是零售业态`);
        }

        const siteKey = `${site.name}||${site.type}`;
        const previousGossips = siteSpyInfo && siteSpyInfo[siteKey] && siteSpyInfo[siteKey].obtainedGossips ? [...siteSpyInfo[siteKey].obtainedGossips] : [];

        if (!isSourceSite) {
          const availableGossip = gossip_LIBRARY.filter(g => !previousGossips.includes(g));
          availableGossip.forEach(g => allLowMessages.push(`🗣️ ${g}`));
        }

        const high = [];
        const medium = [];
        const low = [];

        if (includeHigh && allHighMessages.length > 0) {
          high.push(pick(allHighMessages));
        } else if (includeMedium && allMediumMessages.length > 0) {
          medium.push(pick(allMediumMessages));
        } else if (includeLow && allLowMessages.length > 0) {
          const selected = pick(allLowMessages);
          low.push(selected);
          const gossipMatch = selected.match(/🗣️ (.+)$/);
          if (gossipMatch && !previousGossips.includes(gossipMatch[1])) {
            previousGossips.push(gossipMatch[1]);
          }
        } else if (allHighMessages.length > 0) {
          high.push(pick(allHighMessages));
        }

        setSiteSpyInfo(old => {
          const existingData = old[siteKey] || {};
          const historyArray = existingData.history || [];
          const newRecord = { mode: 'snoop', infoData: { high, medium, low }, timestamp: Date.now() };
          return {
            ...old,
            [siteKey]: {
              ...existingData,
              mode: 'snoop',
              infoData: { high, medium, low },
              obtainedGossips: previousGossips,
              history: [...historyArray, newRecord],
              timestamp: Date.now()
            }
          };
        });
        setSpiInfo({ site, infoData: { high, medium, low } });

        if (Math.random() < 0.01) {
          setPlayerValue(pv => {
            const newInvestigate = pv.investigate + 1;
            showToast(`🎯 经验积累！调查技能 +1 (现在: ${newInvestigate})`);
            return { ...pv, investigate: newInvestigate };
          });
        }
      };

      const handleCounting = () => {
        if (spiMode === 'count') {
          setSpiMode(null);
          return;
        }
        if (energy < ENERGY_COST.count) { showToast('精力不足'); return; }
        setSpiMode('count');
      };

      const handleCountingSite = (site) => {
        const isSourceSite = ['school', 'residential', '写字楼', '车站', '景点'].includes(site.type);
        if (isSourceSite) {
          showToast('无法对主客源站点蹲数据');
          return;
        }

        const siteKey = `${site.name}||${site.type}`;
        if (siteSpyInfo && siteSpyInfo[siteKey] && siteSpyInfo[siteKey].mode === 'count') {
          showToast('已经蹲过该店铺的人数，无法重复蹲数');
          return;
        }

        if (energy < ENERGY_COST.count) { showToast('精力不足'); return; }
        if (site.type !== 'shop' || !site.food) {
          showToast('只能对餐饮店铺蹲人数');
          return;
        }

        if (site.forlease && site.currentRevenue === 0) {
          showToast('该店铺已关闭，无法蹲数据');
          return;
        }

        setEnergy(e => e - ENERGY_COST.count);
        setSpiMode(null);

        const weekday = time.getDay();
        const dayIndex = (weekday + 6) % 7;

        const weekdayFactor = currentStreet.weekdayFactor?.[dayIndex] || 1;
        const baseCustomers = site.forecastCustomers || 0;

        const clamped = Math.max(10, Math.min(40, playerValue.investigate));
        const maxError = 0.15 * (1 - (clamped - 10) / 30);
        const errorMultiplier = 1 + (Math.random() - 0.5) * 2 * maxError;
        const actualCustomers = Math.round(baseCustomers * weekdayFactor * errorMultiplier);

        const high = [];
        const medium = [];
        const low = [];

        const dayNames = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
        high.push(`📊 ${site.name}`);
        high.push(`日期: ${dayNames[dayIndex]}`);
        const errorDesc = maxError > 0 ? `(因为蹲的不专心，数据可能误差最多到${maxError * 100}%)` : '';
        high.push(`实时客流估算: 约${Math.round(actualCustomers)}人 ${errorDesc}`);

        setSiteSpyInfo(old => {
          const existingData = old[siteKey] || {};
          const historyArray = existingData.history || [];
          const newRecord = { mode: 'count', infoData: { high, medium, low }, timestamp: Date.now() };
          return {
            ...old,
            [siteKey]: {
              ...existingData,
              mode: 'count',
              infoData: { high, medium, low },
              history: [...historyArray, newRecord],
              timestamp: Date.now()
            }
          };
        });
        setSpiInfo({ site, infoData: { high, medium, low } });

        if (Math.random() < 0.02) {
          setPlayerValue(pv => {
            const newInvestigate = pv.investigate + 1;
            showToast(`🎯 经验积累！调查技能 +1 (现在: ${newInvestigate})`);
            return { ...pv, investigate: newInvestigate };
          });
        }
      };

      const handleSleep = () => {
        if (!ensureMoney(DAILY_EXPENSE)) return;
        setMoney(m => m - DAILY_EXPENSE);
        setEnergy(e => Math.min(INITIAL_ENERGY, e + ENERGY_RESTORED));
        setTime(t => { const d = new Date(t); d.setDate(d.getDate() + 1); return d; });
        showToast(`休息补充了体力 +${ENERGY_RESTORED}`);
        if (streetData) {
          const allSites = [...(streetData.streetA || []), ...(streetData.streetB || [])];
          checkSitesRentedBySomeone(allSites);
        }
      };

      return (
        <>
          <HUD
            mode={mode}
            money={money}
            setMoney={setMoney}
            time={time}
            streetName={currentStreet?.name}
            takenCount={takenSites.length}
            energy={energy}
            setEnergy={setEnergy}
            playerValue={playerValue}
            setPlayerValue={setPlayerValue}
            loan={loan}
            onLoan={() => setLoanModal(true)}
            myShops={myShops}
          />

          <div style={{ display: 'flex', gap: 6, marginBottom: 8, flexWrap: 'wrap' }}>
            <button className={`mode-btn${mainView === 'street' ? ' active' : ''}`} onClick={() => setMainView('street')}>
              🏪 街道选铺
            </button>
            {myShops.map((shop, i) => (
              <button key={i} className={`mode-btn${mainView === 'simulation' && activeShopConfig === shop ? ' active' : ''}`}
                onClick={() => { setActiveShopConfig(shop); setMainView('simulation'); }}>
                🍽️ {shop.site.name}
              </button>
            ))}
            {myShops.map((shop, i) => (
              <button key={'fp' + i} className={`mode-btn${mainView === 'floorplan' && activeShopConfig === shop ? ' active' : ''}`}
                onClick={() => { setActiveShopConfig(shop); setMainView('floorplan'); }}
                style={{ fontSize: 11 }}>
                📐 布局:{shop.site.name.slice(0, 6)}
              </button>
            ))}
            {pendingFloorplan && (
              <button className={`mode-btn${mainView === 'floorplan-setup' ? ' active' : ''}`}
                onClick={() => setMainView('floorplan-setup')}
                style={{ background: '#fff3cd', borderColor: '#ffc107', color: '#856404' }}>
                ⚙️ 待布局:{pendingFloorplan.site.name.slice(0, 6)}
              </button>
            )}
          </div>

          {mainView === 'street' && (
            <>
              <Controls
                mode={mode}
                setMode={setMode}
                onRegen={() => doRegenerate(false)}
                onSnoop={handleSnoop}
                onCounting={handleCounting}
                onSleep={handleSleepHunting}
              />
              <Legend />
              <div ref={containerRef} id="streets-container">
                {streetData && (
                  <>
                    <StreetRow
                      sites={streetData.streetA}
                      label="Side A"
                      mode={mode}
                      takenSites={takenSites}
                      scale={scale}
                      depthPx={depthPx}
                      onSiteClick={handleSiteClick}
                      spyMode={spiMode}
                      siteSpyInfo={siteSpyInfo}
                      isSiteTakenBySomeone={isSiteTakenBySomeone}
                    />
                    <RoadVisual lanes={streetData.lanes} />
                    <StreetRow
                      sites={streetData.streetB}
                      label="Side B"
                      mode={mode}
                      takenSites={takenSites}
                      scale={scale}
                      depthPx={depthPx}
                      onSiteClick={handleSiteClick}
                      spyMode={spiMode}
                      siteSpyInfo={siteSpyInfo}
                      isSiteTakenBySomeone={isSiteTakenBySomeone}
                    />
                  </>
                )}
              </div>
            </>
          )}

          {mainView === 'floorplan-setup' && pendingFloorplan && (
            <FloorplanView
              shopData={pendingFloorplan}
              money={money}
              setMoney={setMoney}
              onConfirm={(cells, seatSummary, totalSeats, renoCoeff, totalCost, outArea, frontStaff) => {
                const finalShop = { ...pendingFloorplan, cells, seatSummary, totalSeats, renoCoeff, outArea, frontStaff };
                setPendingFloorplan(null);
                setRecruitModal(finalShop);
              }}
              onCancel={() => setMainView('street')}
            />
          )}

          {mainView === 'floorplan' && activeShopConfig && (
            <FloorplanView
              shopData={activeShopConfig}
              money={money}
              setMoney={setMoney}
              readOnly={false}
              onConfirm={(cells, seatSummary, totalSeats, renoCoeff, totalCost, outArea, frontStaff) => {
                const updatedShop = { ...activeShopConfig, cells, seatSummary, totalSeats, renoCoeff, outArea, frontStaff };
                setMyShops(ms => ms.map(s => s === activeShopConfig ? updatedShop : s));
                setActiveShopConfig(updatedShop);
                showToast('✅ 布局已更新！');
                setMainView('street');
              }}
              onCancel={() => setMainView('street')}
            />
          )}

          {mainView === 'simulation' && activeShopConfig && (
            <SimulationView
              shopConfig={activeShopConfig}
              currentStreet={currentStreet}
              time={time}
              onBack={() => setMainView('street')}
              money={money}
              setMoney={setMoney}
              energy={energy}
              setEnergy={setEnergy}
              loan={loan}
              setLoan={setLoan}
              setMyShops={setMyShops}
            />
          )}

          {selectedSite && (
            <SiteModal
              site={selectedSite}
              mode={mode}
              currentStreet={currentStreet}
              time={time}
              money={money}
              isMine={takenSites.includes(selectedSite)}
              onClose={() => setSelectedSite(null)}
              onTake={handleTake}
              onCallResult={handleCallResult}
              onConvert={handleConvertRetail}
              callResultRevealed={callResultRevealed}
              siteSpyInfo={siteSpyInfo}
            />
          )}

          {showForecast && (
            <ForecastModal
              site={showForecast}
              time={time}
              onClose={() => setShowForecast(null)}
            />
          )}

          {spiInfo && (
            <SpiInfoModal
              info={spiInfo}
              onClose={() => setSpiInfo(null)}
            />
          )}

          {foodSelectModal && (
            <FoodSelectModal
              data={foodSelectModal}
              money={money}
              setMoney={setMoney}
              onConfirm={(food, isSameCat, equipCost) => {
                const oldFoodName = foodSelectModal.site.food?.name || '';
                const newName = oldFoodName && foodSelectModal.site.name.includes(oldFoodName)
                  ? foodSelectModal.site.name.replace(oldFoodName, food.name)
                  : `${pick(SHOP_NAMES)}${food.name}`;
                const updatedSite = { ...foodSelectModal.site, food, convertedToFood: !isSameCat || !foodSelectModal.site.food, name: newName };
                setTakenSites(ts => ts.map(s => s === foodSelectModal.site ? updatedSite : s));
                setFranchiseModal({ site: updatedSite, selectedFood: food, isSameCat });
                setFoodSelectModal(null);
              }}
              onCancel={() => setFoodSelectModal(null)}
            />
          )}

          {franchiseModal && (
            <FranchiseModal
              site={franchiseModal.site}
              selectedFood={franchiseModal.selectedFood}
              money={money}
              setMoney={setMoney}
              learnedFoodTech={learnedFoodTech}
              setLearnedFoodTech={setLearnedFoodTech}
              onConfirm={(franchise, learnedTech) => {
                const { site, selectedFood } = franchiseModal;
                setPendingFloorplan({ site, selectedFood, franchise, renoCoeff: 1, learnedTech: !!learnedTech });
                setFranchiseModal(null);
                setMainView('floorplan-setup');
              }}
              onCancel={() => { setFranchiseModal(null); setFoodSelectModal(franchiseModal); }}
            />
          )}

          {recruitModal && (
            <RecruitModal
              site={recruitModal.site}
              onConfirm={(hiredStaff) => {
                const shopConfig = { ...recruitModal, hiredStaff, openDays: 0 };
                setMyShops(ms => [...ms, shopConfig]);
                setRecruitModal(null);
                setActiveShopConfig(shopConfig);
                showToast(`🎉 恭喜开店！${recruitModal.site.name} 正式营业！`);
              }}
              onSkip={() => {
                const shopConfig = { ...recruitModal, hiredStaff: [] };
                setMyShops(ms => [...ms, shopConfig]);
                setRecruitModal(null);
                setActiveShopConfig(shopConfig);
                showToast(`🎉 恭喜开店！${recruitModal.site.name} 正式营业！`);
              }}
            />
          )}

          {loanModal && (
            <div className="modal-bg">
              <div className="modal" style={{ maxWidth: 400 }}>
                <div className="modal-title">🏦 申请贷款</div>
                <p style={{ fontSize: 12, color: '#666', marginBottom: 12 }}>
                  只可贷款一次。年化6%，本息同还，每天支付。
                </p>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 12 }}>
                  {[50000, 100000, 150000].map(amt => {
                    const days = 365;
                    const rate = 0.06 / 365;
                    const dailyPmt = amt * rate * Math.pow(1 + rate, days) / (Math.pow(1 + rate, days) - 1);
                    return (
                      <button key={amt} className="btn" style={{ textAlign: 'left', fontSize: 12, padding: '10px 14px' }}
                        onClick={() => {
                          setMoney(m => m + amt);
                          setLoan({ principal: amt, dailyPayment: dailyPmt, daysLeft: days });
                          setLoanModal(false);
                          setMainView('simulation');
                          showToast(`💰 贷款 ¥${amt.toLocaleString()} 已到账，每日还款 ¥${Math.round(dailyPmt)}`);
                        }}
                        disabled={!!loan}>
                        ¥{amt.toLocaleString()} · 每日还款 ¥{Math.round(dailyPmt)} · 共{days}天
                      </button>
                    );
                  })}
                </div>
                {loan && <div style={{ color: '#c0392b', fontSize: 12, marginBottom: 8 }}>已有贷款，不可再贷</div>}
                <div style={{ display: 'flex', justifyContent: 'flex-end' }}>
                  <button className="btn" onClick={() => {
                    setLoanModal(false);
                    if (activeShopConfig) {
                      setMainView('simulation');
                    }
                  }}>关闭</button>
                </div>
              </div>
            </div>
          )}

          <Toast message={toast} />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
