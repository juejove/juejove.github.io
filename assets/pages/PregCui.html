<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>孕期备忘录</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans SC',-apple-system,sans-serif;background:linear-gradient(160deg,#FFF0F5 0%,#FFF8F9 50%,#FFF5F0 100%);min-height:100vh;overflow-x:hidden}
#app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

.app-header{background:rgba(255,248,249,0.95);border-bottom:1px solid rgba(232,78,130,0.15);padding:14px 18px 10px}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.app-title{font-family:'Noto Serif SC',serif;font-size:19px;font-weight:600;color:#C73B6B;letter-spacing:.5px}
.hdr-sub{font-size:11px;color:#B08090;font-weight:300;margin-top:1px}
.week-badge{background:#FF6B9D;color:#fff;font-size:11px;font-weight:500;padding:4px 10px;border-radius:20px}
.hdr-right{display:flex;align-items:center;gap:8px}
.prog-track{height:3px;background:#FFD6E7;border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:#FF8FB6;border-radius:2px}
.prog-lbl{font-size:10px;color:#B08090;margin-top:3px;font-weight:300}

.tab-nav{display:flex;background:rgba(255,248,249,0.98);border-bottom:1px solid rgba(232,78,130,0.12)}
.tab-btn{flex:1;padding:10px 0;font-size:12px;font-family:'Noto Sans SC',sans-serif;border:none;background:none;color:#B08090;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;font-weight:400}
.tab-btn.active{color:#E84E82;border-bottom-color:#E84E82;font-weight:500}

.view{display:none}
.view.active{display:block}

#scroll-area{padding:14px 14px 20px;display:flex;flex-direction:column;gap:11px}

.ev-card{background:#fff;border-radius:22px;border:1px solid rgba(232,78,130,0.12);overflow:hidden;animation:cardIn .4s cubic-bezier(.34,1.56,.64,1) both}
.ev-card.focus-card{border-color:#FF8FB6}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.done-strip{height:3px;background:#FFB3CE;width:0;transition:width .6s ease}
.ev-card.done .done-strip{width:100%}
.ev-card.done .card-ttl{text-decoration:line-through;opacity:.5}
.card-inner{padding:13px 14px}
.card-hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.card-left{display:flex;gap:8px;align-items:flex-start;flex:1;min-width:0}
.card-meta{flex:1;min-width:0}
.wk-row{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.wk-pill{font-size:10px;font-weight:500;color:#C73B6B;background:#FFF0F5;border:1px solid #FFB3CE;padding:2px 8px;border-radius:20px;flex-shrink:0}
.dt-lbl{font-size:11px;color:#B08090;font-weight:300}
.card-ttl{font-size:15px;font-weight:500;color:#2D1B25;line-height:1.45;word-break:break-all}
.card-note{font-size:12px;color:#7A4E5E;margin-top:4px;line-height:1.5;font-style:italic;font-weight:300}
.card-note-empty{font-size:11px;color:#FFB3CE;margin-top:4px;font-style:italic}
.card-acts{display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.btn-ic{width:30px;height:30px;border-radius:9px;border:none;background:#FFF0F5;color:#E84E82;cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn-ic.del{color:#B08090;background:transparent}
.chk{width:22px;height:22px;border-radius:50%;border:1.5px solid #FFB3CE;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all .25s}
.chk.on{background:#FF6B9D;border-color:#FF6B9D}
.chk svg{width:11px;height:11px;color:#fff;opacity:0;transform:scale(.5);transition:all .2s}
.chk.on svg{opacity:1;transform:scale(1)}
.mo-div{display:flex;align-items:center;gap:8px;padding:3px 0}
.mo-line{flex:1;height:1px;background:#FFD6E7}
.mo-txt{font-size:10px;color:#B08090;font-weight:500;letter-spacing:1px;white-space:nowrap;padding:2px 7px;background:#FFF0F5;border:1px solid rgba(232,78,130,0.12);border-radius:20px}
.edit-form{padding:13px 14px;border-top:1px solid rgba(232,78,130,0.12);background:#FFF5F7}
.form-row{margin-bottom:9px}
.form-lbl{font-size:10px;color:#B08090;font-weight:500;letter-spacing:.5px;text-transform:uppercase;display:block;margin-bottom:4px}
.form-inp{width:100%;padding:9px 12px;border:1px solid rgba(232,78,130,0.25);border-radius:9px;font-size:14px;font-family:'Noto Sans SC',sans-serif;color:#2D1B25;background:#fff;outline:none}
.form-inp:focus{border-color:#FF6B9D;box-shadow:0 0 0 3px rgba(232,78,130,.1)}
.form-inp[type=number]{-moz-appearance:textfield}
.form-inp[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
.form-hint{font-size:10px;color:#B08090;margin-top:3px;display:block}
.time-row{display:flex;gap:8px;align-items:flex-start}
.time-or{font-size:11px;color:#B08090;padding-top:10px;flex-shrink:0}
.week-input-wrap{flex:1}
.date-input-wrap{flex:1.4;position:relative}
.date-cal-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:#FF6B9D;cursor:pointer;padding:2px;display:flex;align-items:center}
.form-btns{display:flex;gap:7px;margin-top:11px}
.btn-save{flex:1;padding:10px;border:none;border-radius:9px;background:#FF6B9D;color:#fff;font-size:13px;font-weight:500;font-family:'Noto Sans SC',sans-serif;cursor:pointer}
.btn-cancel{padding:10px 14px;border:1px solid rgba(232,78,130,0.25);border-radius:9px;background:#fff;color:#7A4E5E;font-size:13px;font-family:'Noto Sans SC',sans-serif;cursor:pointer}

.hist-drawer{background:rgba(255,248,249,0.95);border-bottom:1px solid rgba(232,78,130,0.12);overflow:hidden;max-height:44px;transition:max-height .45s cubic-bezier(.4,0,.2,1)}
.hist-drawer.open{max-height:280px}
.hist-toggle{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;cursor:pointer}
.hist-lbl{font-size:11px;color:#B08090;letter-spacing:1px}
.hist-chev{width:15px;height:15px;color:#B08090;transition:transform .4s}
.hist-drawer.open .hist-chev{transform:rotate(180deg)}
.hist-dot{width:6px;height:6px;border-radius:50%;background:#FF8FB6;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.2)}}
.hist-list{padding:0 14px 12px;max-height:236px;overflow-y:auto;display:flex;flex-direction:column;gap:7px}
.hist-item{background:#FFF0F5;border:1px solid rgba(232,78,130,0.12);border-radius:10px;padding:9px 12px}
.hist-item-hdr{display:flex;justify-content:space-between;margin-bottom:2px}
.hist-wk{font-size:10px;color:#E84E82;font-weight:500}
.hist-dt{font-size:10px;color:#B08090}
.hist-ttl{font-size:13px;color:#7A4E5E;line-height:1.4}
.hist-note{font-size:11px;color:#B08090;margin-top:2px;font-style:italic}
.hist-item.done .hist-ttl{text-decoration:line-through;opacity:.55}

/* CALENDAR */
#cal-view{background:#FFF8F9}
.cal-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;background:rgba(255,248,249,0.98);border-bottom:1px solid rgba(232,78,130,0.12)}
.cal-nav-btn{width:32px;height:32px;border:1px solid rgba(232,78,130,0.12);border-radius:10px;background:#fff;color:#E84E82;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cal-month-ttl{font-family:'Noto Serif SC',serif;font-size:16px;font-weight:600;color:#C73B6B}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);padding:8px 10px 4px;gap:2px}
.cal-dow-lbl{text-align:center;font-size:10px;color:#B08090;font-weight:500}
.cal-grid{padding:4px 10px 10px;display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-day{min-height:52px;border-radius:10px;padding:3px;cursor:pointer;position:relative;transition:background .15s}
.cal-day:active{background:#FFF0F5}
.cal-day.selected{background:#FFF0F5}
.cal-day.other-month .cal-num{color:#FFB3CE}
.cal-day.today .cal-num-inner{background:#E84E82;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;color:#fff}
.cal-num{font-size:12px;font-weight:500;color:#2D1B25;margin-bottom:2px;display:flex;justify-content:center}
.cal-dots{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin-top:1px}
.cal-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.cal-dot.done{background:#FFB3CE}
.cal-dot.pending{background:#E84E82}
.cal-week-band{background:#FFF0F5;border-radius:0 0 8px 8px;margin-top:1px;font-size:9px;color:#E84E82;text-align:center;padding:1px 0;line-height:1.2}
.cal-event-sheet{border-top:1px solid rgba(232,78,130,0.12);padding:12px 14px;background:#fff;min-height:60px}
.cal-ev-ttl{font-size:12px;font-weight:500;color:#C73B6B;margin-bottom:8px}
.cal-ev-list{display:flex;flex-direction:column;gap:6px}
.cal-ev-item{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:#7A4E5E}
.cal-ev-dot{width:7px;height:7px;border-radius:50%;background:#E84E82;flex-shrink:0;margin-top:3px}
.cal-ev-dot.done{background:#FFB3CE}
.cal-ev-name{flex:1;line-height:1.4;color:#2D1B25}
.cal-ev-wk{font-size:10px;color:#B08090;white-space:nowrap}
.cal-empty{font-size:12px;color:#B08090;text-align:center;padding:12px 0;font-style:italic}
.swipe-hint{font-size:10px;color:#FFB3CE;text-align:center;padding:4px 0 8px}

/* CONVERTER — using system CSS vars for dark mode safety */
#conv-view{padding:16px 14px 24px;background:#FFF8F9}
.conv-card{background:#fff;border-radius:18px;border:1px solid rgba(232,78,130,0.15);padding:18px 16px;margin-bottom:0}
.conv-section-lbl{font-size:10px;font-weight:500;letter-spacing:.8px;text-transform:uppercase;color:var(--color-text-secondary,#B08090);margin-bottom:8px;display:block}
.conv-field{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.conv-field-lbl{font-size:13px;color:var(--color-text-secondary,#7A4E5E);width:56px;flex-shrink:0}
.conv-date-inp{flex:1;padding:10px 12px;border:1.5px solid rgba(232,78,130,0.25);border-radius:10px;font-size:15px;font-family:'Noto Sans SC',sans-serif;color:var(--color-text-primary,#2D1B25);background:var(--color-background-secondary,#FFF0F5);outline:none}
.conv-date-inp:focus{border-color:#FF6B9D;background:var(--color-background-primary,#fff);box-shadow:0 0 0 3px rgba(232,78,130,.1)}
.conv-wkday-row{display:flex;gap:6px;flex:1;align-items:flex-end}
.conv-num-wrap{flex:1;text-align:center}
.conv-num-inp{width:100%;padding:10px 6px;border:1.5px solid rgba(232,78,130,0.25);border-radius:10px;font-size:17px;font-family:'Noto Sans SC',sans-serif;color:var(--color-text-primary,#2D1B25);background:var(--color-background-secondary,#FFF0F5);outline:none;text-align:center}
.conv-num-inp:focus{border-color:#FF6B9D;background:var(--color-background-primary,#fff);box-shadow:0 0 0 3px rgba(232,78,130,.1)}
.conv-num-inp[type=number]{-moz-appearance:textfield}
.conv-num-inp[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
.conv-num-unit{font-size:11px;color:var(--color-text-secondary,#B08090);margin-top:4px}
.conv-plus{font-size:16px;color:var(--color-text-secondary,#B08090);padding-bottom:14px}
.conv-arrow{display:flex;align-items:center;justify-content:center;padding:10px 0 6px;color:#FFB3CE;font-size:20px;letter-spacing:4px}
.conv-results{background:#FFF0F5;border-radius:12px;border:1px solid #FFD6E7;padding:14px 16px;margin-top:14px}
.conv-result-row{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-bottom:1px solid rgba(232,78,130,0.08)}
.conv-result-row:last-child{border-bottom:none}
.conv-rlbl{font-size:12px;color:var(--color-text-secondary,#7A4E5E)}
.conv-rval{font-size:13px;font-weight:500;color:var(--color-text-primary,#2D1B25)}
.conv-rval.big{font-size:15px;color:#C73B6B}
.conv-footer{font-size:10px;color:var(--color-text-secondary,#B08090);text-align:center;margin-top:10px;font-style:italic}

/* FAB */
#fab{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:200;background:#E84E82;color:#fff;border:none;padding:13px 26px;border-radius:30px;font-size:14px;font-weight:500;font-family:'Noto Sans SC',sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
#fab.hidden{display:none}

.sheet-bg{position:fixed;inset:0;z-index:300;background:rgba(45,27,37,.4);display:flex;align-items:flex-end;opacity:0;transition:opacity .3s;pointer-events:none}
.sheet-bg.vis{opacity:1;pointer-events:all}
.sheet{width:100%;max-width:430px;margin:0 auto;background:#fff;border-radius:24px 24px 0 0;padding:18px 18px 38px;transform:translateY(100%);transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.sheet-bg.vis .sheet{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:#FFD6E7;border-radius:2px;margin:0 auto 18px}
.sheet-ttl{font-family:'Noto Serif SC',serif;font-size:16px;font-weight:600;color:#C73B6B;margin-bottom:14px;text-align:center}
.cfg-note{font-size:11px;color:#B08090;line-height:1.6;background:#FFF0F5;border:1px solid rgba(232,78,130,0.12);border-radius:9px;padding:9px 11px;margin-bottom:13px}
#cfg-btn{width:34px;height:34px;border-radius:11px;border:1px solid rgba(232,78,130,0.12);background:#fff;color:#B08090;cursor:pointer;display:flex;align-items:center;justify-content:center}
.export-section{margin-top:14px;border-top:1px solid rgba(232,78,130,0.12);padding-top:14px}
.export-lbl{font-size:11px;color:#B08090;font-weight:500;letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px;display:block}
.export-btns{display:flex;flex-direction:column;gap:8px}
.btn-export{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid rgba(232,78,130,0.25);border-radius:12px;background:#fff;color:#2D1B25;font-size:13px;font-family:'Noto Sans SC',sans-serif;cursor:pointer;text-align:left}
.btn-export .exp-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px}
.btn-export .exp-desc{font-size:10px;color:#B08090;margin-top:1px}

#sync-bar{position:fixed;top:0;left:50%;transform:translateX(-50%) translateY(-60px);z-index:400;background:#fff;border:1px solid rgba(232,78,130,0.12);border-radius:0 0 14px 14px;padding:9px 18px;font-size:12px;color:#7A4E5E;transition:transform .35s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;max-width:300px}
#sync-bar.show{transform:translateX(-50%) translateY(0)}
.sync-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#FF6B9D;margin-right:5px;vertical-align:middle}
</style>
</head>
<body>
<div id="app">

<header class="app-header">
  <div class="hdr-top">
    <div>
      <div class="app-title">🌸 孕期备忘录</div>
      <div class="hdr-sub">末次月经 2026年4月23日</div>
    </div>
    <div class="hdr-right">
      <div id="wk-badge" class="week-badge">计算中</div>
      <button id="cfg-btn" onclick="toggleCfg()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93A10 10 0 1 0 4.93 19.07M19.07 4.93L12 12"/></svg>
      </button>
    </div>
  </div>
  <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  <div class="prog-lbl" id="prog-lbl">加载中…</div>
</header>

<nav class="tab-nav">
  <button class="tab-btn active" onclick="switchTab('list',this)">📋 事件列表</button>
  <button class="tab-btn" onclick="switchTab('cal',this)">📅 月历</button>
  <button class="tab-btn" onclick="switchTab('conv',this)">⇄ 日期换算</button>
</nav>

<!-- LIST -->
<div id="list-view" class="view active">
  <div class="hist-drawer" id="hist-drawer">
    <div class="hist-toggle" onclick="toggleHist()">
      <div class="hist-dot"></div>
      <span class="hist-lbl">历史记录</span>
      <svg class="hist-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
    </div>
    <div class="hist-list" id="hist-list"></div>
  </div>
  <div id="scroll-area"><div style="text-align:center;padding:48px;color:#B08090;font-size:13px">🌸 加载中…</div></div>
</div>

<!-- CALENDAR -->
<div id="cal-view" class="view">
  <div class="cal-header">
    <button class="cal-nav-btn" onclick="calPrev()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="cal-month-ttl" id="cal-month-ttl"></div>
    <button class="cal-nav-btn" onclick="calNext()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>
  <div class="cal-dow" id="cal-dow"></div>
  <div class="cal-grid" id="cal-grid"></div>
  <div class="swipe-hint">← 左右滑动切换月份 →</div>
  <div class="cal-event-sheet" id="cal-event-sheet"><div class="cal-empty">点击日期查看事件</div></div>
</div>

<!-- CONVERTER -->
<div id="conv-view" class="view">
  <div class="conv-card">
    <span class="conv-section-lbl">公历日期</span>
    <div class="conv-field">
      <span class="conv-field-lbl">日期</span>
      <input class="conv-date-inp" type="date" id="conv-date" oninput="convFromDate()">
    </div>

    <div class="conv-arrow">⇅</div>

    <span class="conv-section-lbl">孕周 + 天数</span>
    <div class="conv-field">
      <span class="conv-field-lbl">孕周天</span>
      <div class="conv-wkday-row">
        <div class="conv-num-wrap">
          <input class="conv-num-inp" type="number" id="conv-wk" min="1" max="45" placeholder="—" oninput="convFromWkDay()">
          <div class="conv-num-unit">周</div>
        </div>
        <div class="conv-plus">+</div>
        <div class="conv-num-wrap">
          <input class="conv-num-inp" type="number" id="conv-day" min="0" max="6" placeholder="—" oninput="convFromWkDay()">
          <div class="conv-num-unit">天</div>
        </div>
      </div>
    </div>

    <div class="conv-results" id="conv-results">
      <div class="conv-result-row">
        <span class="conv-rlbl">孕期阶段</span>
        <span class="conv-rval big" id="res-stage">—</span>
      </div>
      <div class="conv-result-row">
        <span class="conv-rlbl">本周区间</span>
        <span class="conv-rval" id="res-range">—</span>
      </div>
      <div class="conv-result-row">
        <span class="conv-rlbl">距预产期</span>
        <span class="conv-rval" id="res-due">—</span>
      </div>
      <div class="conv-result-row">
        <span class="conv-rlbl">怀孕月份</span>
        <span class="conv-rval" id="res-month">—</span>
      </div>
    </div>
    <div class="conv-footer">末次月经：2026年4月23日 · 预产期：2027年1月28日</div>
  </div>
</div>

</div>

<button id="fab" onclick="openAdd()">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  添加事件
</button>

<div id="add-bg" class="sheet-bg" onclick="bgClick(event,'add-bg')">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-ttl">✦ 添加新事件</div>
    <div class="form-row">
      <label class="form-lbl">时间（二选一）</label>
      <div class="time-row">
        <div class="week-input-wrap">
          <input class="form-inp" type="number" id="add-wk" min="1" max="42" placeholder="孕周数" oninput="onWeekInput('add')">
          <span class="form-hint">输入后显示为周区间</span>
        </div>

function wkToDate(w, d = 0) {
  const dt = new Date(LMP);
  // 医学上 1周+0天 是第7天。我们要以 0周+0天 为基准点，公式改为 (w * 7) + d
  dt.setDate(dt.getDate() + (w * 7) + d);
  return dt.toISOString().slice(0, 10);
}
// 2. 修改：根据公历日期，精确反推“已满周数”和“剩余天数”
function dateToWkDay(s) {
  const d = new Date(s + 'T00:00:00');
  // 计算相差的绝对天数
  const days = Math.floor((d - LMP) / 86400000);
  
  // 医学标准：整除 7 为已满周数，余数为天数
  const wk = Math.floor(days / 7);
  const dy = days % 7;
  
  return { 
    wk: wk, 
    day: dy 
  };
}

// 3. 修改：获取当前日期的纯周数（用于列表分组或卡片显示）
function dateToWk(s) {
  return dateToWkDay(s).wk;
}
function curWk() {
  const days = Math.floor((new Date() - LMP) / 86400000);
  return Math.floor(days / 7);
}
function fmtDate(s){const d=new Date(s+'T00:00:00');return`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`}
function fmtMY(s){const d=new Date(s+'T00:00:00');return`${d.getFullYear()}年${d.getMonth()+1}月`}
function isWeekBased(ev){return ev.date===wkToDate(ev.week)}
function displayTime(ev) {
  if (isWeekBased(ev)) {
    const s = new Date(LMP);
    s.setDate(s.getDate() + (ev.week * 7)); // 改为以满周为基准点
    const e = new Date(s);
    e.setDate(e.getDate() + 6);
    const sm = s.getMonth() + 1, sd = s.getDate(), em = e.getMonth() + 1, ed = e.getDate();
    return sm === em ? `${sm}月${sd}–${ed}日` : `${sm}月${sd}日–${em}月${ed}日`;
  }
  return fmtDate(ev.date);
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function sorted(){return[...events].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id-b.id)}

ill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></button></div></div></div><div class="form-row"><label class="form-lbl">事件内容</label><input class="form-inp" id="et${ev.id}" value="${esc(ev.title)}"></div><div class="form-row"><label class="form-lbl">备注</label><input class="form-inp" id="en${ev.id}" value="${esc(ev.note)}" placeholder="就诊结果、费用等…"></div><div class="form-btns"><button class="btn-cancel" onclick="closeEdit(${ev.id})">取消</button><button class="btn-save" onclick="saveEdit(${ev.id})">保存 →</button></div></div></div></div>`;

  });
}

/* Calendar */
function initCal(){const n=new Date();calYear=n.getFullYear();calMonth=n.getMonth()}
function calPrev(){calMonth--;if(calMonth<0){calMonth=11;calYear--}renderCal()}
function calNext(){calMonth++;if(calMonth>11){calMonth=0;calYear++}renderCal()}
function renderCal(){
  document.getElementById('cal-dow').innerHTML=['日','一','二','三','四','五','六'].map(d=>`<div class="cal-dow-lbl">${d}</div>`).join('');
  document.getElementById('cal-month-ttl').textContent=`${calYear}年${calMonth+1}月`;
  const today=new Date().toISOString().slice(0,10);
  const first=new Date(calYear,calMonth,1),last=new Date(calYear,calMonth+1,0);
  const evMap={};events.forEach(ev=>{if(!evMap[ev.date])evMap[ev.date]=[];evMap[ev.date].push(ev)});
  let html='';
  const sdow=first.getDay();
  for(let i=0;i<sdow;i++){const d=new Date(calYear,calMonth,1-sdow+i);html+=calDayHTML(d.toISOString().slice(0,10),d.getDate(),true,evMap,today)}
  for(let d=1;d<=last.getDate();d++){const ds=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;html+=calDayHTML(ds,d,false,evMap,today)}
  const rem=(7-((sdow+last.getDate())%7))%7;
  for(let i=1;i<=rem;i++){const d=new Date(calYear,calMonth+1,i);html+=calDayHTML(d.toISOString().slice(0,10),d.getDate(),true,evMap,today)}
  document.getElementById('cal-grid').innerHTML=html;
  if(calSelectedDate)renderCalEvents(calSelectedDate);
}
function calDayHTML(ds,dn,other,evMap,today){
  const evs=evMap[ds]||[];const{wk,day}=dateToWkDay(ds);const inPreg=wk>=1&&wk<=40;const isToday=ds===today;
  const isSel=ds===calSelectedDate;
  let cls='cal-day';if(other)cls+=' other-month';if(isToday)cls+=' today';if(isSel)cls+=' selected';
  const num=isToday?`<div class="cal-num-inner">${dn}</div>`:dn;
  const dots=evs.length?`<div class="cal-dots">${evs.slice(0,4).map(e=>`<div class="cal-dot ${e.done?'done':'pending'}"></div>`).join('')}</div>`:'';
  const band=inPreg&&!other?`<div class="cal-week-band">孕${wk}w${day>0?'+'+day:''}</div>`:'';
  return`<div class="${cls}" onclick="selectCalDay('${ds}')" data-date="${ds}"><div class="cal-num">${num}</div>${dots}${band}</div>`;
}
function selectCalDay(ds){calSelectedDate=ds;document.querySelectorAll('.cal-day').forEach(el=>{el.classList.toggle('selected',el.dataset.date===ds)});renderCalEvents(ds)}
function renderCalEvents(ds){
  const evs=events.filter(e=>e.date===ds);const{wk,day}=dateToWkDay(ds);const d=new Date(ds+'T00:00:00');
  const dateStr=`${d.getMonth()+1}月${d.getDate()}日`;const wkStr=wk>=1&&wk<=42?` · 孕${wk}周${day>0?' +'+day+'天':''}`:'';
  let html=`<div class="cal-ev-ttl">${dateStr}${wkStr}</div>`;
  html+=evs.length?'<div class="cal-ev-list">'+evs.map(ev=>`<div class="cal-ev-item"><div class="cal-ev-dot ${ev.done?'done':''}"></div><div class="cal-ev-name">${esc(ev.title)}${ev.note?`<br><span style="font-size:10px;color:#B08090;font-style:italic">${esc(ev.note)}</span>`:''}</div><div class="cal-ev-wk">孕${ev.week}周</div></div>`).join('')+'</div>':'<div class="cal-empty">当天无事件</div>';
  document.getElementById('cal-event-sheet').innerHTML=html;
}

/* Converter */
function convFromDate(){
  const ds=document.getElementById('conv-date').value;
  if(!ds)return clearConv();
  const{wk,day}=dateToWkDay(ds);
  document.getElementById('conv-wk').value=wk;
  document.getElementById('conv-day').value=day;
  updateConv(wk,day,ds);
}
function convFromWkDay(){
  const wk=parseInt(document.getElementById('conv-wk').value)||0;
  const day=parseInt(document.getElementById('conv-day').value)||0;
  if(!wk)return clearConv();
  const ds=wkToDate(wk,day);
  document.getElementById('conv-date').value=ds;
  updateConv(wk,day,ds);
}
function clearConv(){['res-stage','res-range','res-due','res-month'].forEach(id=>document.getElementById(id).textContent='—')}
function updateConv(wk,day,ds){
  let stage='';
  if(wk<1)stage='末次月经前';
  else if(wk<=12)stage=`孕早期 第${wk}周`;
  else if(wk<=27)stage=`孕中期 第${wk}周`;
  else if(wk<=40)stage=`孕晚期 第${wk}周`;
  else stage='超过预产期';
  document.getElementById('res-stage').textContent=stage;
  const ws=new Date(LMP);ws.setDate(ws.getDate()+(wk-1)*7);
  const we=new Date(ws);we.setDate(we.getDate()+6);
  const sm=ws.getMonth()+1,sd=ws.getDate(),em=we.getMonth()+1,ed=we.getDate();
  document.getElementById('res-range').textContent=sm===em?`${sm}月${sd}–${ed}日`:`${sm}月${sd}日–${em}月${ed}日`;
  const diff=Math.round((DUE-new Date(ds+'T00:00:00'))/86400000);
  document.getElementById('res-due').textContent=diff>0?`还有 ${diff} 天`:diff===0?'今天就是预产期！':`已过 ${-diff} 天`;
  document.getElementById('res-month').textContent=`第 ${Math.ceil(wk/4)} 个月`;
}

function toggleCfg(){const p=document.getElementById('cfg-bg');if(p.classList.contains('vis')){closeCfg();return}document.getElementById('cfg-owner').value=ghCfg.owner||'';document.getElementById('cfg-repo').value=ghCfg.repo||'';document.getElementById('cfg-path').value=ghCfg.path||'pregnancy.json';document.getElementById('cfg-token').value=ghCfg.token||'';p.classList.add('vis')}
function closeCfg(){document.getElementById('cfg-bg').classList.remove('vis')}
function saveCfg(){ghCfg={owner:document.getElementById('cfg-owner').value.trim(),repo:document.getElementById('cfg-repo').value.trim(),path:document.getElementById('cfg-path').value.trim()||'pregnancy.json',token:document.getElementById('cfg-token').value.trim()};localStorage.setItem('pg_ghcfg',JSON.stringify(ghCfg));closeCfg();showSync('配置已保存，正在同步…');loadGH().then(ok=>showSync(ok?'✓ 已从 GitHub 加载':'⚠ 同步失败，使用本地数据'))}
function showSync(msg){const b=document.getElementById('sync-bar');document.getElementById('sync-msg').textContent=msg;b.classList.add('show');setTimeout(()=>b.classList.remove('show'),3200)}
async function getSha(){const{owner,repo,path,token}=ghCfg;const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`,{headers:{Authorization:`token ${token}`,Accept:'application/vnd.github.v3+json'}});return r.ok?(await r.json()).sha:null}
async function loadGH(){const{owner,repo,path,token}=ghCfg;if(!owner||!repo||!token)return false;try{const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`,{headers:{Authorization:`token ${token}`,Accept:'application/vnd.github.v3+json'}});if(r.ok){const d=await r.json();const raw=atob(d.content.replace(/\n/g,''));const decoded=new TextDecoder().decode(new Uint8Array([...raw].map(c=>c.charCodeAt(0))));events=JSON.parse(decoded);render();if(histOpen)renderHist();return true}}catch(e){}return false}
async function saveGH(){const{owner,repo,path,token}=ghCfg;if(!owner||!repo||!token){localStorage.setItem('pg_local',JSON.stringify(events));return}showSync('同步中…');try{const sha=await getSha();const json=JSON.stringify(events,null,2);const bytes=new TextEncoder().encode(json);let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));const content=btoa(bin);const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`,{method:'PUT',headers:{Authorization:`token ${token}`,'Content-Type':'application/json',Accept:'application/vnd.github.v3+json'},body:JSON.stringify({message:'Update pregnancy events',content,...(sha?{sha}:{})})});showSync(r.ok?'✓ 已保存到 GitHub':'⚠ 保存失败 '+r.status)}catch(e){showSync('⚠ 网络错误，已本地保存');localStorage.setItem('pg_local',JSON.stringify(events))}}
function makeICS(){const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//孕期备忘录//ZH','CALSCALE:GREGORIAN','METHOD:PUBLISH'];sorted().forEach(ev=>{const uid=`pg-${ev.id}-${ev.date}@pregnancy`;const start=ev.date.replace(/-/g,'');const endD=new Date(ev.date+'T00:00:00');endD.setDate(endD.getDate()+1);const end=endD.toISOString().slice(0,10).replace(/-/g,'');const summary=`[孕${ev.week}周] ${ev.title}`;const desc=ev.note?`备注：${ev.note}`:'';lines.push('BEGIN:VEVENT',`UID:${uid}`,`DTSTART;VALUE=DATE:${start}`,`DTEND;VALUE=DATE:${end}`,`SUMMARY:${summary}`,...(desc?[`DESCRIPTION:${desc}`]:[]),'END:VEVENT')});lines.push('END:VCALENDAR');return lines.join('\r\n')}
function exportICS(type){const ics=makeICS();const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=type==='apple'?'孕期日历_Apple.ics':'孕期日历.ics';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);showSync('✓ 已下载日历文件')}

/* Swipe */
function initCalSwipe(){const el=document.getElementById('cal-view');el.addEventListener('touchstart',e=>{swipeStartX=e.touches[0].clientX},{passive:true});el.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-swipeStartX;if(Math.abs(dx)>50){dx<0?calNext():calPrev()}},{passive:true})}

async function init(){
  loadCfg();updateHeader();initCal();initCalSwipe();
  let loaded=false;
  if(ghCfg.owner&&ghCfg.repo&&ghCfg.token){showSync('正在从 GitHub 加载…');loaded=await loadGH();if(loaded)showSync('✓ 已从 GitHub 加载')}
  if(!loaded){const local=localStorage.getItem('pg_local');if(local){try{events=JSON.parse(local);loaded=true}catch(e){}}}
  if(!loaded)events=DEFAULTS;
  render();updateHeader();
  document.getElementById('conv-date').value=new Date().toISOString().slice(0,10);
  convFromDate();
  setTimeout(()=>{const today=new Date().toISOString().slice(0,10);const s=sorted();const idx=s.findIndex(e=>e.date>=today&&!e.done);if(idx>=0){const cards=document.querySelectorAll('.ev-card');if(cards[idx])cards[idx].scrollIntoView({behavior:'smooth',block:'center'})}},600);
}
init();
</script>
</body>
</html>
