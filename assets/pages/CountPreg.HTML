<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown to October 7, 2025</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ffc0cb 0%, #ffffff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(255, 192, 203, 0.4);
            text-align: center;
            max-width: 500px;
            width: 100%;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 192, 203, 0.3);
        }

        h1 {
            color: #ff69b4;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(255, 192, 203, 0.3);
        }

        .date-target {
            color: #ff1493;
            font-size: 1.3em;
            margin-bottom: 40px;
            font-weight: 600;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .time-box {
            background: linear-gradient(135deg, #ffb6c1 0%, #ffc0cb 100%);
            border-radius: 20px;
            padding: 25px 20px;
            min-width: 120px;
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.3);
            transition: transform 0.3s ease;
        }

        .time-box:hover {
            transform: translateY(-5px);
        }

        .time-value {
            font-size: 3em;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .time-label {
            font-size: 0.9em;
            color: #8b0045;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
            font-weight: 600;
        }

        .details {
            background: rgba(255, 192, 203, 0.2);
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
            color: #8b0045;
            font-size: 1.1em;
            line-height: 1.6;
        }

        .sparkle {
            display: inline-block;
            animation: sparkle 1.5s infinite;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        @media (max-width: 600px) {
            .countdown {
                flex-direction: column;
                gap: 15px;
            }

            h1 {
                font-size: 2em;
            }

            .time-box {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><span class="sparkle">✨</span> Time Since <span class="sparkle">✨</span></h1>
        <div class="date-target">October 7, 2025</div>
        
        <div class="countdown">
            <div class="time-box">
                <div class="time-value" id="weeks">0</div>
                <div class="time-label">Weeks</div>
            </div>
            <div class="time-box">
                <div class="time-value" id="days">0</div>
                <div class="time-label">Days</div>
            </div>
        </div>

        <div class="details">
            <div id="total-days"></div>
        </div>
    </div>

    <script>
        function calculateCountdown() {
            const now = new Date();
            const target = new Date(2025,9,7);
            
            const diffTime = now - target;
            const totalDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            
            const weeks = Math.floor(totalDays / 7);
            const days = totalDays % 7;
            
            document.getElementById('weeks').textContent = weeks;
            document.getElementById('days').textContent = days;
            document.getElementById('total-days').textContent = 
                `That's ${totalDays} total days since then!`;
        }

        calculateCountdown();
        setInterval(calculateCountdown, 60000);
    </script>
</body>

</html>
